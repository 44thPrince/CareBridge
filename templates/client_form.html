{% extends "base.html" %}
{% block content %}
<h2>Register as a Client</h2>
<p>We're here to help you find the right caregiver for your needs.</p>

<form method="POST">
  <h3>Basic Information</h3>
  
  <label>Full Name:</label><br>
  <input type="text" name="full_name" required><br><br>

  <label>Phone Number:</label><br>
  <input type="tel" name="phone_number" required><br><br>

  <label>Date of Birth:</label><br>
  <input type="date" name="date_of_birth" required><br><br>

  <label>Address:</label><br>
  <input type="text" name="address"><br><br>

  <h3>Emergency Contact</h3>
  
  <label>Emergency Contact Name:</label><br>
  <input type="text" name="emergency_contact_name"><br><br>

  <label>Emergency Contact Phone:</label><br>
  <input type="tel" name="emergency_contact_phone"><br><br>

  <h3>Medical Information</h3>

  <label>Medical Conditions (optional):</label><br>
  <textarea name="medical_conditions" rows="3" placeholder="Please list any relevant medical conditions or health concerns..."></textarea><br><br>

  <label>Special Instructions for Caregivers (optional):</label><br>
  <textarea name="special_instructions" rows="3" placeholder="Any specific needs, preferences, or instructions for your caregiver..."></textarea><br><br>

  <button type="submit" class="cta-button">Register as Client</button>
</form>
{% endblock %}
