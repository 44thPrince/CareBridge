<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CareBridge</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 1em;
    }
    th, td {
      border: 1px solid #18161638;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #d3d3f0, #f08f4f);
      font-family: Arial, sans-serif;
    }

    nav {
      background-color: #ffffffaa;
      padding: 10px;
    }
    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }

    .message {
      background-color: #fff;
      border-left: 4px solid #333;
      margin: 10px 0;
      padding: 10px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('show_client_form') }}">Clients</a>
    <a href="{{ url_for('show_caretaker_form') }}">Caretakers</a>
  </nav>

  {% for message in get_flashed_messages() %}
    <p class="message">{{ message }}</p>
  {% endfor %}

  {% block content %}
  {% endblock %}
</body>
</html>
